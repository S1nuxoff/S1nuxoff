<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <style>
    .bg { fill: #0d1117; }
    .dot { fill: #30363d; }
    .frame { fill: none; stroke: #30363d; }
    .name { fill: #f0f6fc; font: 700 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .role { fill: #8b949e; font: 400 26px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .prompt { fill: #3fb950; font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cmd { fill: #c9d1d9; font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f8fa; }
      .dot { fill: #d0d7de; }
      .frame { stroke: #d0d7de; }
      .name { fill: #1f2328; }
      .role { fill: #59636e; }
      .prompt { fill: #1a7f37; }
      .cmd { fill: #1f2328; }
      .cursor { fill: #1a7f37; }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="2" cy="2" r="1.5"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="320" rx="16"/>
  <rect class="frame" x="0.5" y="0.5" width="1199" height="319" rx="15.5"/>
  <rect width="1200" height="320" fill="url(#dots)" mask="url(#m)"/>

  <text x="72" y="104"><tspan class="prompt">~ $</tspan><tspan class="cmd" dx="12">whoami</tspan></text>
  <text class="name" x="72" y="188">Vadym Shchypanskyi</text>
  <rect x="72" y="214" width="96" height="5" rx="2.5" fill="url(#accent)"/>
  <text class="role" x="72" y="262">Freelance developer · websites, booking systems, Telegram bots</text>
  <rect class="cursor" x="212" y="84" width="12" height="26"/>
</svg>
